# Reusable release workflow — install into the central CI repository.
#
#   repo: <owner>/<central-ci-repo>   file: .github/workflows/release.yml
#
# Called by a thin, SHA-pinned caller in each product repository
# (see callers/product-release.yml). Nothing here is specific to one app:
# the caller passes the app slug, the artifact glob and the target repo.
#
# Security rules enforced by this file
# ------------------------------------
# * No secret is available to pull requests: the workflow is only reachable via
#   workflow_call from a caller pinned to a commit on a protected branch.
# * Third-party actions are pinned to full commit SHAs, never tags.
# * Permissions are least-privilege: `contents: read` at the top, `write` only
#   in the publish job, which runs after the artifact is built and hashed.
# * The signing key is read from an environment secret and is never echoed,
#   never written to a file inside the workspace, never uploaded as an artifact.
#   Signing happens in a step whose only output is the detached signature.
# * The publish job re-hashes the downloaded release asset and refuses to
#   continue if it differs from the built digest (no silent corruption).
name: release

on:
  workflow_call:
    inputs:
      app_slug:
        description: Application slug as registered in the store (e.g. media-downloader).
        required: true
        type: string
      version:
        description: Release version/tag to publish (e.g. v2.4.1).
        required: true
        type: string
      artifact_glob:
        description: Glob for the installer(s) to publish, relative to the workspace.
        required: true
        type: string
      dist_repo:
        description: Public distribution repository, owner/repo.
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease (beta channel).
        required: false
        default: false
        type: boolean
      primary_glob:
        description: >-
          Glob (matched against the artifact's internal paths, e.g.
          "*/installer/*.exe") identifying the one asset the Store links to.
          Everything else in the artifact is still published as a release asset.
        required: false
        default: ""
        type: string
      feed_mode:
        description: >-
          How to publish this app's update manifest. "electron-updater" generates
          a latest.yml from the published bytes (sha512 + sha256 + size are
          computed here, never trusted from the input). "signed-json" copies an
          already-signed manifest verbatim and verifies that the sha256 inside it
          matches the published binary. "" disables feed publication.
        required: false
        default: ""
        type: string
      feed_manifest:
        description: >-
          Path (within the downloaded artifacts) of the source manifest. For
          electron-updater mode this is the builder's latest.yml; for signed-json
          mode it is the signed latest.json produced by the product's own signer.
        required: false
        default: ""
        type: string
      feed_branch:
        description: Branch of the distribution repository that carries the feeds tree.
        required: false
        default: main
        type: string

      artifact_name:
        description: >-
          Name of an artifact already uploaded in this same workflow run
          (same-run handoff). When set, the build job downloads it instead of
          compiling, so a Windows product build can hand its installer to this
          Linux publish workflow without widening any token's scope.
        required: false
        default: ""
        type: string
      sign:
        description: Produce a detached Ed25519 signature + manifest.
        required: false
        default: true
        type: boolean
    secrets:
      DIST_REPO_TOKEN:
        description: Fine-grained token with contents:write on dist_repo only.
        required: true
      SIGNING_KEY:
        description: Ed25519 private key (PEM) used to sign the manifest. Never printed.
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build + digest
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
      artifact: ${{ steps.pick.outputs.artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download handed-off artifact (same run)
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.artifact_name }}
          path: incoming

      - name: Build
        if: ${{ inputs.artifact_name == '' }}
        run: |
          set -euo pipefail
          if [ -f package.json ] && command -v npm >/dev/null; then
            npm ci --no-audit --no-fund
            npm run build --if-present
          fi

      - name: Select installer
        id: pick
        run: |
          set -euo pipefail
          primary="${{ inputs.primary_glob }}"
          if [ -n "${{ inputs.artifact_name }}" ]; then
            if [ -n "$primary" ]; then
              files=$(find incoming -type f -path "$primary" | sort || true)
            else
              files=$(find incoming -type f | sort || true)
            fi
          else
            # shellcheck disable=SC2086
            files=$(ls -1 ${{ inputs.artifact_glob }} 2>/dev/null || true)
          fi
          count=$(printf '%s' "$files" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one installer, found $count"
            exit 1
          fi
          echo "artifact=$files" >> "$GITHUB_OUTPUT"

      - name: Hash
        id: hash
        run: |
          set -euo pipefail
          digest=$(sha256sum "${{ steps.pick.outputs.artifact }}" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha256: $digest"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: installer
          path: ${{ steps.pick.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign manifest
    needs: build
    if: ${{ inputs.sign }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: installer

      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          APP_SLUG: ${{ inputs.app_slug }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          set -euo pipefail
          # Key arrives on stdin via a file the step deletes before exit; it is
          # never echoed and never uploaded.
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEY" > "$keyfile"
          python3 - "$keyfile" "$APP_SLUG" "$VERSION" "$DIGEST" "$ARTIFACT" <<'PY'
          import base64, json, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          key_path, app, version, digest, artifact = sys.argv[1:6]
          key = serialization.load_pem_private_key(Path(key_path).read_bytes(), password=None)
          payload = {"app": app, "version": version, "sha256": digest,
                     "asset": Path(artifact).name, "channel": "beta" if version.endswith("-beta") else "stable"}
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          doc = {"payload": payload, "signature": base64.b64encode(key.sign(canonical)).decode()}
          Path("latest.json").write_text(json.dumps(doc, indent=2))
          # The public key is printed so it can be stored in the registry.
          print("public key (safe to publish):")
          print(key.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo).decode())
          PY

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: manifest
          path: latest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to dist repo
    needs: [build, sign]
    # `always()` would publish unsigned builds when signing fails; require both.
    if: ${{ always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: staging

      - name: Verify artifact digest before publishing
        run: |
          set -euo pipefail
          primary="${{ inputs.primary_glob }}"
          if [ -n "$primary" ]; then
            f=$(find staging -type f -path "$primary" | sort | head -1)
          else
            f=$(find staging -type f | sort | head -1)
          fi
          if [ -z "${f:-}" ]; then
            echo "::error::primary asset not found in artifacts"
            exit 1
          fi
          echo "primary asset: $f"
          got=$(sha256sum "$f" | cut -d' ' -f1)
          if [ "$got" != "${{ needs.build.outputs.digest }}" ]; then
            echo "::error::digest changed between build and publish"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          VERSION: ${{ inputs.version }}
          PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=()
          [ "$PRE" = "true" ] && args+=(--prerelease)
          # Upload each distinct asset name exactly once. A wildcard can list the
          # same file twice (nested artifact paths), and GitHub rejects the second
          # upload with "ReleaseAsset.name already exists", failing the release
          # and rolling it back.
          mapfile -t files < <(find staging -type f -printf '%f\t%p\n' | sort -t$'\t' -k1,1 -u | cut -f2-)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no files to publish"
            exit 1
          fi
          printf 'publishing %d asset(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          gh release create "$VERSION" \
            --repo "$DIST_REPO" \
            --title "${{ inputs.app_slug }} $VERSION" \
            --notes "Automated release for ${{ inputs.app_slug }} $VERSION" \
            "${args[@]}" \
            "${files[@]}"

      - name: Post-publish check (digest visible to clients)
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh api "repos/$DIST_REPO/releases/tags/$VERSION" > release.json
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("release.json"))
          want = os.environ["DIGEST"]
          digests = {a.get("digest") for a in data.get("assets", [])}
          if not any(d and d.endswith(want) for d in digests):
              sys.exit("published asset does not expose the expected sha256 digest")
          print("digest confirmed on the published release")
          PY

  # ── app-specific, domain-independent update feed ──────────────────────────
  # Publishes feeds/<app>/<channel>/latest.<ext> in the distribution repository.
  # Clients fetch this from raw.githubusercontent.com, so update discovery and
  # downloads never touch the Store domain.
  #
  # Isolation: the path is built from the app slug and the channel, so
  # publishing app B can never overwrite app A's feed, and a prerelease writes
  # to the beta channel, never over stable.
  feed:
    name: publish app feed manifest
    needs: [build, publish]
    if: ${{ inputs.feed_mode != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: staging

      - name: Build manifest from published bytes
        id: manifest
        env:
          MODE: ${{ inputs.feed_mode }}
          MANIFEST_SRC: ${{ inputs.feed_manifest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys

          mode = os.environ["MODE"].strip()
          src = os.environ["MANIFEST_SRC"].strip()
          app = "${{ inputs.app_slug }}"
          version = "${{ inputs.version }}"
          dist = "${{ inputs.dist_repo }}"
          pre = "${{ inputs.prerelease }}" == "true"
          channel = "beta" if pre else "stable"

          base = f"https://github.com/{dist}/releases/download/{version}"
          staged = list(pathlib.Path("staging").rglob("*"))
          manifest_path = next((p for p in staged if p.is_file() and str(p).endswith(src)), None)
          if manifest_path is None:
              sys.exit(f"manifest not found in artifacts: {src}")

          def digest(p, algo):
              h = hashlib.new(algo)
              with open(p, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h

          def find(name):
              hits = [p for p in staged if p.is_file() and p.name == name]
              if not hits:
                  sys.exit(f"referenced asset missing from artifacts: {name}")
              return hits[0]

          if mode == "electron-updater":
              text = manifest_path.read_text()
              # minimal targeted parse: the block `files:` → `- url:` and the
              # scalar keys electron-updater actually consumes.
              import re
              mv = re.search(r"^version:\s*(\S+)\s*$", text, re.M)
              if not mv:
                  sys.exit("latest.yml has no version")
              declared = mv.group(1)
              urls = re.findall(r"^\s*-\s*url:\s*(\S+)\s*$", text, re.M)
              paths = re.findall(r"^path:\s*(\S+)\s*$", text, re.M)
              if not urls:
                  sys.exit("latest.yml has no files[].url")
              asset_name = urls[0].split("/")[-1]
              target = find(asset_name)
              sha512 = hashlib.sha512(target.read_bytes()).hexdigest()
              sha512_b64 = __import__("base64").b64encode(bytes.fromhex(sha512)).decode()
              sha256 = hashlib.sha256(target.read_bytes()).hexdigest()
              size = target.stat().st_size
              if str(size) not in text:
                  sys.exit(f"manifest size does not describe the published bytes ({size})")
              manifest = (
                  f"app: {app}\n"
                  f"channel: {channel}\n"
                  f"version: {version.lstrip('v')}\n"
                  f"files:\n"
                  f"  - url: {base}/{asset_name}\n"
                  f"    sha512: {sha512_b64}\n"
                  f"    sha256: {sha256}\n"
                  f"    size: {size}\n"
                  f"path: {asset_name}\n"
                  f"sha512: {sha512_b64}\n"
                  f"sha256: {sha256}\n"
                  f"size: {size}\n"
              )
              prev = re.search(r"^releaseDate:.*$", text, re.M)
              if prev:
                  manifest += prev.group(0) + "\n"
              ext = "yml"
          elif mode == "signed-json":
              manifest = manifest_path.read_text()
              doc = json.loads(manifest)
              if doc.get("version") != version.lstrip("v"):
                  sys.exit(f"signed manifest version {doc.get('version')} != {version}")
              for f in doc.get("files", []):
                  target = find(str(f.get("url", "")).split("/")[-1])
                  if f.get("size") and int(f["size"]) != target.stat().st_size:
                      sys.exit("signed manifest size does not match the published asset")
                  if f.get("sha256") and f["sha256"].lower() != hashlib.sha256(target.read_bytes()).hexdigest():
                      sys.exit("signed manifest sha256 does not match the published asset")
              if "signature" not in doc:
                  sys.exit("signed-json mode requires a signed manifest")
              ext = "json"
          else:
              sys.exit(f"unknown feed_mode: {mode}")

          pathlib.Path("feed.out").write_text(manifest)
          pathlib.Path("feed.meta").write_text(json.dumps(
              {"app": app, "channel": channel, "version": version, "ext": ext}))

          # Some clients (the MD bootstrapper) also read a portable manifest to
          # offer the no-install flavour. Publish it beside latest.yml, rewritten
          # the same way, but only when the build actually produced one.
          extra = None
          if mode == "electron-updater":
              src_portable = next((p for p in staged if p.is_file() and p.name == "portable.yml"), None)
              if src_portable is not None:
                  text = src_portable.read_text()
                  import re
                  urls = re.findall(r"^\s*-\s*url:\s*(\S+)\s*$", text, re.M)
                  if urls:
                      name = urls[0].split("/")[-1]
                      tgt = find(name)
                      b = tgt.read_bytes()
                      s512 = __import__("base64").b64encode(hashlib.sha512(b).digest()).decode()
                      extra = (
                          f"app: {app}\n"
                          f"channel: {channel}\n"
                          f"version: {version.lstrip('v')}\n"
                          f"files:\n"
                          f"  - url: {base}/{name}\n"
                          f"    sha512: {s512}\n"
                          f"    sha256: {hashlib.sha256(b).hexdigest()}\n"
                          f"    size: {len(b)}\n"
                          f"path: {name}\n"
                          f"sha512: {s512}\n"
                          f"sha256: {hashlib.sha256(b).hexdigest()}\n"
                          f"size: {len(b)}\n"
                      )
                      pathlib.Path("feed.extra").write_text(extra)
                      print(f"portable manifest ready: {name}")
          print(f"manifest ready: app={app} channel={channel} version={version} ext={ext}")
          PY

      - name: Commit feed atomically (with history)
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          BRANCH: ${{ inputs.feed_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, requests
          tok = os.environ["GH_TOKEN"]; repo = os.environ["DIST_REPO"]; branch = os.environ["BRANCH"]
          meta = json.loads(pathlib.Path("feed.meta").read_text())
          body = pathlib.Path("feed.out").read_bytes()
          app, channel, version, ext = meta["app"], meta["channel"], meta["version"], meta["ext"]
          api = f"https://api.github.com/repos/{repo}/contents"
          hdr = {"Authorization": f"token {tok}", "Accept": "application/vnd.github+json"}

          def put(path, data, message):
              cur = requests.get(f"{api}/{path}", params={"ref": branch}, headers=hdr, timeout=30)
              payload = {"message": message, "branch": branch,
                         "content": base64.b64encode(data).decode()}
              if cur.status_code == 200:
                  payload["sha"] = cur.json()["sha"]
              elif cur.status_code != 404:
                  raise SystemExit(f"cannot read {path}: {cur.status_code}")
              r = requests.put(f"{api}/{path}", json=payload, headers=hdr, timeout=60)
              if r.status_code not in (200, 201):
                  raise SystemExit(f"commit failed for {path}: {r.status_code} {r.text[:200]}")
              return r.json()["commit"]["sha"]

          hist = f"feeds/{app}/{channel}/history/{version}.{ext}"
          live = f"feeds/{app}/{channel}/latest.{ext}"
          c1 = put(hist, body, f"feed({app}/{channel}): archive {version}")
          c2 = put(live, body, f"feed({app}/{channel}): publish {version}")
          print(f"history commit {c1[:8]} → live commit {c2[:8]}")
          paths = [live, hist]
          if pathlib.Path("feed.extra").exists():
              extra = pathlib.Path("feed.extra").read_bytes()
              put(f"feeds/{app}/{channel}/history/portable-{version}.yml", extra,
                  f"feed({app}/{channel}): archive portable {version}")
              c3 = put(f"feeds/{app}/{channel}/portable.yml", extra,
                       f"feed({app}/{channel}): publish portable {version}")
              print(f"portable commit {c3[:8]}")
              paths.append(f"feeds/{app}/{channel}/portable.yml")
          pathlib.Path("feed.paths").write_text("\n".join(paths) + "\n")
          PY

      - name: Verify what a client will actually download
        env:
          DIST_REPO: ${{ inputs.dist_repo }}
          BRANCH: ${{ inputs.feed_branch }}
        run: |
          set -euo pipefail
          mapfile -t paths < feed.paths
          for i in $(seq 1 12); do
            ok=1
            for live in "${paths[@]}"; do
              raw="https://raw.githubusercontent.com/${DIST_REPO}/${BRANCH}/${live}"
              if ! curl -fsS --max-time 20 "$raw" -o fetched || ! cmp -s fetched feed.out; then
                # portable.yml has its own body; compare it to feed.extra
                if [[ "$live" == *portable.yml ]] && [[ -f feed.extra ]] && cmp -s fetched feed.extra; then
                  :
                else
                  ok=0
                fi
              fi
            done
            if [ "$ok" = "1" ]; then
              echo "feed live and byte-identical: ${paths[*]}"
              exit 0
            fi
            echo "not propagated yet (attempt $i)"
            sleep 5
          done
          echo "::error::published feed does not match what clients will fetch"
          exit 1
