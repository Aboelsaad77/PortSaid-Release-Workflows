# Mechanics self-test for the reusable release workflow.
# Proves the plumbing (digest -> publish -> post-publish verification) executes.
# The artifact is a one-line text file labelled as a mechanics probe: it is NOT
# a product build and must never be presented as one.
name: pipeline-selftest
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: Aboelsaad77/PortSaid-Release-Workflows/.github/workflows/release.yml@8aaa63120cf4f164d89b3997aeaf08bd10c6df6f
    with:
      app_slug: media-downloader
      version: v0.0.2-pipeline-mechanics
      artifact_glob: "mechanics/*.zip"
      dist_repo: Aboelsaad77/PortSaid-Releases
      prerelease: true
      sign: false
    secrets:
      DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
